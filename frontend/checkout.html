<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CartNova | Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
<meta name="description" content="Choose a saved delivery address and delivery option, then review your CartNova order. Payments are simulated."><meta property="og:title" content="CartNova | Checkout"><meta property="og:description" content="Choose a saved delivery address and delivery option, then review your CartNova order. Payments are simulated."><meta property="og:type" content="website"><meta name="robots" content="noindex, nofollow"></head>
<body>
  <div data-navbar></div>

  <main class="container">
    <div class="page-header">
      <div class="breadcrumb">
        <a href="index.html">Home</a> /
        <a href="cart.html">Cart</a> /
        <span>Checkout</span>
      </div>
      <h1>Checkout</h1>
      <div class="checkout-steps">
        <span class="step-chip active">1. Address</span><span class="step-chip active">2. Delivery</span><span class="step-chip active">3. Payment</span><span class="step-chip active">4. Review Order</span><span class="step-chip">5. Confirmation</span>
      </div>
    </div>

    <form id="checkoutForm" class="layout-2col">
      <div>
        <section class="panel" style="margin-bottom:1rem">
          <h2>Delivery Address</h2>
          <div id="checkoutAddressChoices"></div>
          <p class="muted" style="margin-top:.8rem">Manage addresses in <a href="profile.html#addresses">My Account → Addresses</a>.</p>
        </section>

        <section class="panel" style="margin-bottom:1rem"><h2>Delivery option</h2><div class="payment-options">
          <label class="payment-option"><input type="radio" name="deliveryMethod" value="STANDARD" checked><div><strong>Standard Delivery</strong><div class="muted">Illustrative estimate: 5 days · ₹49 or FREE at ₹999 payable value and above. No carrier is connected.</div></div></label>
          <label class="payment-option"><input type="radio" name="deliveryMethod" value="EXPRESS"><div><strong>Express Delivery</strong><div class="muted">Illustrative estimate: 2 days · ₹99. No carrier is connected.</div></div></label>
        </div></section>

        <section class="panel">
          <h2>Payment Method</h2>
          <div class="payment-options">
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="COD" checked />
              <div>
                <strong>Cash on Delivery</strong>
                <div style="color:var(--muted);font-size:0.9rem">Pay when your order arrives.</div>
              </div>
            </label>
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="ONLINE" />
              <div>
                <strong>UPI</strong>
                <div style="color:var(--muted);font-size:0.9rem">Frontend simulation only. No payment is sent.</div>
              </div>
            </label>
            <label class="payment-option"><input type="radio" name="paymentMethod" value="CARD"><div><strong>Card</strong><div class="muted">Test placeholder only. Never enter card details here.</div></div></label>
            <label class="payment-option"><input type="radio" name="paymentMethod" value="RAZORPAY"><div><strong>Razorpay test mode</strong><div class="muted">Placeholder; no payment integration is connected.</div></div></label>
          </div>
        </section>
      </div>

      <aside class="panel">
        <h3>Order Summary</h3>
        <div id="checkoutItems"></div>
        <div class="summary-row" style="margin-top:1rem"><span>Subtotal</span><span id="sumSubtotal">₹0</span></div>
        <div class="summary-row"><span>Discount</span><span id="sumDiscount">- ₹0</span></div>
        <div class="summary-row" id="sumCouponRow" hidden><span>Coupon</span><span id="sumCoupon">- ₹0</span></div>
        <div class="summary-row"><span>GST (included)</span><span id="sumGst">₹0</span></div>
        <div class="summary-row"><span>Delivery</span><span id="sumDelivery">₹0</span></div>
        <div class="summary-row total"><span>Total</span><span id="sumTotal">₹0</span></div>
        <button class="btn btn-primary btn-block" type="submit" style="margin-top:1rem">Place Order</button>
        <a class="btn btn-ghost btn-block" href="cart.html" style="margin-top:0.5rem">Back to Cart</a>
      </aside>
    </form>
  </main>

  <div data-footer></div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/features.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/stage4.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      UI.mountChrome({ active: "" });
      Stage4Checkout.init();
    });
  </script>
</body>
</html>
