<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — CartNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div data-navbar></div>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p>Join CartNova and start shopping smarter.</p>
      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input id="name" type="text" placeholder="Your name" required />
          <div class="form-error">Name is required</div>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required />
          <div class="form-error">Valid email is required</div>
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input id="phone" type="tel" placeholder="10-digit phone" required />
          <div class="form-error">Phone is required</div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" minlength="6" placeholder="Min 6 characters" required />
          <div class="form-error">Password must be at least 6 characters</div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" type="password" minlength="6" required />
          <div class="form-error">Passwords must match</div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Create Account</button>
      </form>
      <p class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>
  </main>

  <div data-footer></div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      UI.mountChrome({ active: "login" });
      AuthPages.initRegister();
    });
  </script>
</body>
</html>
