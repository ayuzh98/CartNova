<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Products — CartNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/admin.css" />
<meta name="description" content="Manage CartNova admin products features and account information."><meta property="og:title" content="Admin Products | CartNova"><meta property="og:description" content="Manage CartNova admin products features and account information."><meta property="og:type" content="website"><meta name="robots" content="noindex, nofollow"></head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar" data-admin-sidebar></aside>
    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Products</h1>
        <button class="btn btn-primary btn-sm" id="addProductBtn">Add Product</button>
      </div>
      <section class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminProductsBody"></tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => Admin.initProducts());
  </script>
</body>
</html>
