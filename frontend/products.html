<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — CartNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div data-navbar></div>

  <main class="container">
    <div class="page-header">
      <div class="breadcrumb">
        <a href="index.html">Home</a> / <span>Products</span>
      </div>
      <h1 id="productsTitle">All Products</h1>
      <p class="section-subtitle" style="margin-bottom:0">Search, filter, and sort to find the perfect match.</p>
    </div>

    <div class="products-layout">
      <aside class="filters" id="categories">
        <h3>Filters</h3>
        <div class="filter-group">
          <strong>Category</strong>
          <div id="categoryFilters" style="margin-top:0.7rem"></div>
        </div>
        <div class="filter-group">
          <strong>Price Range (₹)</strong>
          <div class="form-row" style="margin-top:0.7rem">
            <input id="minPrice" type="number" min="0" placeholder="Min" />
            <input id="maxPrice" type="number" min="0" placeholder="Max" />
          </div>
        </div>
        <div class="filter-group">
          <strong>Minimum Rating</strong>
          <div style="margin-top:0.7rem">
            <label><input type="radio" name="rating" value="0" checked /> Any</label>
            <label><input type="radio" name="rating" value="4" /> 4★ & up</label>
            <label><input type="radio" name="rating" value="4.5" /> 4.5★ & up</label>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="applyFilters">Apply Filters</button>
        <button class="btn btn-ghost btn-block" id="clearFilters" style="margin-top:0.5rem">Clear</button>
      </aside>

      <section>
        <div class="toolbar">
          <div id="productCount">Loading products...</div>
          <label>
            Sort by
            <select id="sortSelect">
              <option value="newest">Newest</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Rating</option>
            </select>
          </label>
        </div>
        <div class="product-grid" id="productGrid"></div>
        <div class="pagination" id="pagination"></div>
      </section>
    </div>
  </main>

  <div data-footer></div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      UI.mountChrome({ active: "products" });
      ProductsPage.init();
    });
  </script>
</body>
</html>
